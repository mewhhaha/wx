name: Editor Benchmarks

on:
  pull_request:
    paths:
      - 'apps/playground/**'
      - 'packages/**'
      - 'scripts/benchmark-*'
      - 'benchmarks/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark matrix to run
        type: choice
        options: [smoke, full]
        default: full
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.0', cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.9.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bench:editor:smoke -- --out benchmarks/results/ci-smoke.json
      - run: pnpm bench:compare -- --candidate benchmarks/results/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with: { name: editor-benchmark-smoke, path: benchmarks/results/ci-smoke.json }
  full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.0', cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.9.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bench:editor:full -- --out benchmarks/results/ci-full.json
      - uses: actions/upload-artifact@v4
        with: { name: editor-benchmark-full, path: benchmarks/results/ci-full.json }
